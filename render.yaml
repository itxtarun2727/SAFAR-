# Render deployment blueprint for SAFAR backend & managed PostgreSQL
services:
  - type: web
    name: safar-backend
    env: python
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: safar-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: "database"

databases:
  - name: safar-postgres
    region: singapore
    plan: free
    databaseName: safar_db
    user: safar
